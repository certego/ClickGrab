[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clickgrab"
version = "0.1.0"
description = "ClickFix analyzer"
readme = "README.md"
# Tells setuptools to dynamically read dependencies from requirements.txt
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools]
py-modules = ["clickgrab", "models", "extractors", "redirect_follower"]